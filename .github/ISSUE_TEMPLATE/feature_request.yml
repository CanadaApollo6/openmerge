name: Feature request
description: Propose a capability or change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like OpenMerge to do. Mention the roadmap phase it fits, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including how other tools handle it.

name: openmerge

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: openmerge
      POSTGRES_DB: openmerge
      POSTGRES_PASSWORD: ${OPENMERGE_POSTGRES_PASSWORD:?set OPENMERGE_POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U openmerge -d openmerge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  openmerge:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENMERGE_DATABASE_URL: postgres://openmerge:${OPENMERGE_POSTGRES_PASSWORD}@postgres:5432/openmerge?sslmode=disable
      OPENMERGE_GITHUB_APP_ID: ${OPENMERGE_GITHUB_APP_ID:?set OPENMERGE_GITHUB_APP_ID}
      OPENMERGE_GITHUB_INSTALLATION_ID: ${OPENMERGE_GITHUB_INSTALLATION_ID:?set OPENMERGE_GITHUB_INSTALLATION_ID}
      OPENMERGE_GITHUB_PRIVATE_KEY: /run/secrets/github-private-key.pem
      OPENMERGE_REPOS: ${OPENMERGE_REPOS:?set OPENMERGE_REPOS}
      OPENMERGE_BASE: ${OPENMERGE_BASE:-main}
      OPENMERGE_GIT_CACHE_DIR: /var/lib/openmerge/git
      OPENMERGE_API_LISTEN: 0.0.0.0:8081
      OPENMERGE_API_TOKEN: ${OPENMERGE_API_TOKEN:?set OPENMERGE_API_TOKEN to a random bearer token}
      OPENMERGE_LOG_LEVEL: ${OPENMERGE_LOG_LEVEL:-info}
      OPENMERGE_DELETE_HEAD_BRANCH: ${OPENMERGE_DELETE_HEAD_BRANCH:-true}
    volumes:
      - git-cache:/var/lib/openmerge/git
      - type: bind
        source: ${OPENMERGE_GITHUB_PRIVATE_KEY_PATH:?set an absolute OPENMERGE_GITHUB_PRIVATE_KEY_PATH}
        target: /run/secrets/github-private-key.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - 127.0.0.1:8081:8081
    stop_grace_period: 180s
    restart: unless-stopped

volumes:
  postgres-data:
  git-cache:

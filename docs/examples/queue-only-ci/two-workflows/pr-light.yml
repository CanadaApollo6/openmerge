# Copy to .github/workflows/pr-light.yml in your repository.
# Light, advisory suite for pull requests. Never list `pr-light` as a required
# check in a branch ruleset or in `merge_when`: queue commits never run it.
# See docs/guides/queue-only-ci.md.
name: pr-light

on:
  pull_request:

permissions:
  contents: read

# Cancelling superseded PR runs is safe: this workflow never gates landing.
concurrency:
  group: pr-light-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-light:
    name: pr-light
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Replace with your fast checks: format, lint, build, unit tests.
      - run: make lint test-unit
